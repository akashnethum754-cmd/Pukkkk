<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1a0713">
<title>Lynko</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
<style>
:root{--rose:#ff5c8a;--peach:#ffb38a;--lilac:#b28cff;--txt:#fff0f5;--mut:#d6a6ba;--line:rgba(255,255,255,.12);--panel:#240b1d}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
[hidden]{display:none!important}
html,body{height:100%;width:100%;overflow:hidden}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--txt);overflow:hidden;background:#1a0713}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
input,textarea{font:16px 'DM Sans',sans-serif;color:var(--txt);background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:14px;padding:12px 14px;outline:0;min-width:0}
input:focus{border-color:var(--rose)}
::placeholder{color:#b98aa0}
.app{position:relative;width:100%;height:100dvh;overflow:hidden;display:grid;grid-template-columns:370px 1fr}
.side,.main{display:flex;flex-direction:column;min-height:0;position:relative}
.side{background:#1d0817;border-right:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:6px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px}
.lg{flex:1;font:italic 600 30px 'Fraunces',serif;background:linear-gradient(120deg,var(--peach),var(--rose) 55%,var(--lilac));-webkit-background-clip:text;background-clip:text;color:transparent;padding-left:6px}
.lg i{font-style:normal;display:inline-block;animation:beat 1.4s infinite;-webkit-text-fill-color:var(--rose)}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.25)}28%{transform:scale(1)}42%{transform:scale(1.15)}}
.ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:19px}
.ic:active,.item:active{background:rgba(255,255,255,.1)}
.meb{width:40px;height:40px;padding:0}
.av{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:19px;flex:none;overflow:hidden;background:linear-gradient(135deg,var(--peach),var(--rose) 60%,var(--lilac));color:#3a0a24}
.av img{width:100%;height:100%;object-fit:cover}
.meb .av,.sm .av{width:38px;height:38px;font-size:16px}
.srch{padding:0 12px 8px}.srch input{width:100%;border-radius:99px;padding:11px 18px;background:rgba(255,255,255,.08)}
.chips{display:flex;gap:8px;padding:0 12px 10px;overflow-x:auto;scrollbar-width:none}
.chips button{flex:none;padding:7px 16px;border-radius:99px;background:rgba(255,255,255,.08);font-size:14px;color:var(--mut);border:1px solid transparent}
.chips button.on{background:rgba(255,92,138,.22);color:var(--txt);border-color:var(--rose)}
.list{flex:1;overflow-y:auto}
.nav{display:flex;border-top:1px solid var(--line);background:#1d0817;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;display:grid;justify-items:center;gap:2px;padding:9px 0 8px;font-size:12px;color:var(--mut)}
.nav i{font-style:normal;font-size:21px;padding:2px 20px;border-radius:99px}.nav .on{color:var(--txt);font-weight:700}.nav .on i{background:rgba(255,92,138,.25)}
.hero{padding:40px 24px;text-align:center;display:grid;gap:14px;justify-items:center}
.hero>i{font-style:normal;font-size:70px;animation:beat 1.4s infinite;filter:drop-shadow(0 0 16px var(--rose))}
.hero h2{font:italic 600 28px 'Fraunces',serif}.hero p{color:var(--mut);line-height:1.6;max-width:300px}.hero .idbox{max-width:300px}.hero .btn{max-width:300px;flex:none;width:100%}
.item{width:100%;display:flex;align-items:center;gap:13px;padding:10px 14px;text-align:left}
.item.on{background:rgba(255,255,255,.08)}
.item .n{flex:1;min-width:0;border-bottom:1px solid var(--line);padding:6px 0 10px}
.r1,.r2{display:flex;align-items:center;gap:8px}
.r1 b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16.5px}
.r1 time{font-size:12px;color:var(--mut)}
.r2{margin-top:3px}.pv{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mut);font-size:14.5px}
.pv.ty{color:var(--rose)}
.badge{background:var(--rose);color:#2a0618;font-weight:700;font-size:12px;min-width:21px;height:21px;border-radius:99px;display:grid;place-items:center;padding:0 6px;font-style:normal}
.badge:empty{display:none}
.empty{padding:50px 24px;text-align:center;color:var(--mut);line-height:1.7}
.fab{position:absolute;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:18px;font-size:24px;background:linear-gradient(135deg,var(--rose),#c14bff);box-shadow:0 10px 28px rgba(255,92,138,.45)}
.main{--wp:radial-gradient(900px 700px at 10% 0%,#4a0d33,transparent 60%),#1a0713;background:#1a0713}
.none{flex:1;display:grid;place-items:center;text-align:center;color:var(--mut);padding:30px;background:var(--wp)}
.none i{display:block;font-style:normal;font-size:70px;animation:beat 1.4s infinite;filter:drop-shadow(0 0 18px var(--rose))}
.head{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 8px 8px;background:#2a0f22;border-bottom:1px solid var(--line);z-index:2}
.head .t{flex:1;min-width:0}.head .t div{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head small{display:block;color:var(--mut);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head small.ty{color:var(--rose);font-weight:700}
.back{display:none}
.msgs{flex:1;overflow-y:auto;padding:12px 10px 18px;display:flex;flex-direction:column;gap:3px;background:var(--wp);overscroll-behavior:contain}
.sys{align-self:center;font-size:12.5px;color:var(--mut);background:rgba(20,5,15,.7);padding:5px 12px;border-radius:99px;margin:8px 0}
.row{display:flex;animation:pop .18s ease-out}.row.me{justify-content:flex-end}
.row:has(.rxp:not([hidden])){margin-bottom:13px}
@keyframes pop{from{transform:translateY(6px);opacity:0}}
.b{position:relative;max-width:min(80%,480px);padding:7px 10px 5px;border-radius:16px;line-height:1.38;font-size:16px;-webkit-touch-callout:none;word-break:break-word}
.them .b{background:#3a1a30;border-top-left-radius:4px}
.me .b{background:linear-gradient(135deg,#d8366f,#8d3bd6);border-top-right-radius:4px}
.tx{white-space:pre-wrap}
.meta{float:right;margin:6px 0 -2px 10px;font-size:11px;opacity:.75;display:flex;gap:4px;align-items:center}
.tk.rd{color:#7fe3ff;opacity:1}
.b.med{padding:3px 3px 5px}.b.med .tx{padding:5px 7px 0}.b.med .meta{margin-right:6px}
.b.jumbo{background:none!important;padding:0;font-size:48px;line-height:1.15}.jumbo .meta{font-size:11px}
.rxp{position:absolute;bottom:-13px;right:8px;background:#2a0f22;border:1px solid var(--line);border-radius:99px;padding:1px 7px;font-size:13px}
.mb{position:relative;width:min(70vw,290px);max-height:380px;border-radius:13px;overflow:hidden;background:#0005}
.mb img,.mb video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mb .th{filter:blur(10px);transform:scale(1.15)}.mb.ok .th{display:none}
.mb .full{opacity:0;transition:opacity .25s}.mb.ok .full{opacity:1}
.sp{display:none;position:absolute;inset:0;margin:auto;width:34px;height:34px;border:3px solid #fff5;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
.mb.ld .sp{display:block}@keyframes spin{to{transform:rotate(360deg)}}
.play{position:absolute;inset:0;margin:auto;width:54px;height:54px;border-radius:50%;background:#0008;display:grid;place-items:center;font-size:22px}
.dur{position:absolute;left:8px;bottom:6px;font-size:12px;background:#0007;padding:2px 7px;border-radius:99px}
.mb.ok .play,.mb.ld .play,.mb.ok .dur,.mb.bad .play{display:none}
.mb.bad::after{content:'Tap to retry';position:absolute;inset:0;display:grid;place-items:center;background:#0008;font-size:13px}
.comp{display:flex;gap:8px;align-items:flex-end;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#1d0817}
.pill{flex:1;display:flex;align-items:flex-end;background:#33152a;border-radius:24px;border:1px solid var(--line)}
.pill textarea{flex:1;border:0;background:none;resize:none;max-height:120px;padding:12px 6px;line-height:1.3;border-radius:0}
.ib{width:44px;height:46px;font-size:21px;flex:none}
.send{width:48px;height:48px;border-radius:50%;font-size:20px;flex:none;background:linear-gradient(135deg,var(--rose),#c14bff);box-shadow:0 6px 18px rgba(255,92,138,.4)}
.attm{position:absolute;left:10px;bottom:70px;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:10px;display:flex;gap:14px}
.attm button{display:grid;gap:4px;justify-items:center;font-size:26px;padding:8px 12px;border-radius:14px}.attm span{font-size:12px;color:var(--mut)}
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,2,8,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;padding:20px}
.ov.sh{align-items:end;padding:0}
.dlg{width:100%;max-width:340px;padding:22px;border-radius:24px;background:var(--panel);border:1px solid var(--line);text-align:center}
.sh .dlg{max-width:520px;border-radius:26px 26px 0 0;padding:20px 20px max(28px,calc(20px + env(safe-area-inset-bottom)));text-align:left;max-height:88dvh;overflow:auto}
.dlg h3{margin-bottom:14px}.dlg input.pin{width:100%;text-align:center;font-size:24px;letter-spacing:8px}
.dlg .r{display:flex;gap:10px;margin-top:14px}.dlg .r button,.btn{flex:1;padding:13px;border-radius:14px;background:rgba(255,255,255,.1);font-weight:700}
.dlg .r .ok,.btn.p{background:linear-gradient(135deg,var(--rose),#c14bff)}
.mi{width:100%;text-align:left;padding:15px 8px;font-size:16.5px;border-bottom:1px solid var(--line)}
.mn{width:100%;max-width:340px}.emo{display:flex;justify-content:space-between;background:var(--panel);border-radius:99px;padding:8px 10px;margin-bottom:10px}.emo button{font-size:28px;padding:2px 5px}
.mn .act{background:var(--panel);border-radius:18px;overflow:hidden}
.pf{display:grid;gap:12px;justify-items:center}.pf .big{width:130px;height:130px;font-size:52px;cursor:pointer;position:relative}.pf label{justify-self:start;color:var(--mut);font-size:13px}
.pf input{width:100%}.idbox{width:100%;text-align:center;padding:12px;border-radius:14px;border:1px dashed rgba(255,92,138,.6);background:rgba(255,92,138,.1);color:var(--mut)}.idbox b{display:block;font-size:24px;letter-spacing:3px;color:var(--txt)}
.wg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0}.wg button{aspect-ratio:3/4;border-radius:14px;border:2px solid var(--line);font-size:11px;display:grid;align-items:end;padding:5px;text-shadow:0 1px 3px #000}
.wg button.on{border-color:var(--rose)}
.pvw{display:flex;flex-direction:column;place-items:initial;padding:0;background:#0c0309;inset:auto;top:0;left:0;width:100%;height:100vh;height:100dvh;overflow:hidden}
.pvw .x,.tst .x{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;z-index:3;width:42px;height:42px;border-radius:50%;background:#0008;font-size:18px}
/* media is pinned inside its box, so a tall video can never push the caption/send bar off screen */
.pvw .st{position:relative;flex:1 1 0;min-height:0;overflow:hidden;margin-top:calc(56px + env(safe-area-inset-top))}
.pvw .st img,.pvw .st video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.cb{flex:none;position:relative;z-index:3;display:flex;gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:#1d0817}.cb input{flex:1;border-radius:24px}
.lb{background:#000;padding:0}.lb img{max-width:100%;max-height:100%;object-fit:contain}
.nav button{position:relative}.nav .dot{position:absolute;top:6px;left:calc(50% + 12px);width:10px;height:10px;border-radius:50%;background:var(--rose);border:2px solid #1d0817;font-style:normal}
.sec{padding:14px 16px 4px;color:var(--mut);font-size:13px;font-weight:700}
.ring{position:relative;padding:3px;border-radius:50%;background:#5b3a50;flex:none}
.ring.un,.ring.mine{background:linear-gradient(135deg,var(--peach),var(--rose) 55%,var(--lilac))}.ring.none{background:none}
.ring .av{border:2px solid #1d0817;box-sizing:content-box}
.ring .plus{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--rose),#c14bff);display:grid;place-items:center;font-weight:700;border:2px solid #1d0817;font-size:15px;line-height:1}
.qt{display:flex;gap:8px;align-items:center;background:rgba(0,0,0,.25);border-left:3px solid var(--peach);border-radius:8px;padding:5px 8px;margin-bottom:5px;font-size:13.5px;overflow:hidden}
.qt img{width:40px;height:40px;object-fit:cover;border-radius:6px;flex:none}.qt>div{min-width:0}
.qt b{display:block;color:var(--peach);font-size:12.5px}.qt span{display:block;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.sv{position:fixed;top:0;left:0;width:100%;height:100vh;height:100dvh;z-index:40;background:#000;display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none}
.spg{display:flex;gap:4px;padding:calc(8px + env(safe-area-inset-top)) 10px 0;z-index:3;flex:none}
.spg i{flex:1;height:3px;border-radius:3px;background:#fff4;overflow:hidden}.spg b{display:block;height:100%;width:0;background:#fff}
.shd{display:flex;align-items:center;gap:10px;padding:10px;z-index:3;flex:none}
.shd .who .av{width:40px;height:40px;font-size:16px}
.shd .tm{flex:1;min-width:0}.shd .tm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.shd .tm small{color:#fffc;font-size:12.5px}
.shd button{width:40px;height:40px;border-radius:50%;font-size:18px;flex:none}
.scn{position:relative;flex:1 1 0;min-height:0;overflow:hidden}
.scn .cont{position:absolute;inset:0;display:grid;place-items:center}
.scn .cont img,.scn .cont video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.scn .cont.txt{padding:28px;text-align:center;font:600 30px/1.3 'DM Sans',sans-serif;white-space:pre-wrap;word-break:break-word;overflow:auto}
.scn .ssp{position:absolute;inset:0;margin:auto;width:38px;height:38px;border:3px solid #fff5;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
.scap{position:absolute;left:0;right:0;bottom:0;padding:44px 18px 14px;text-align:center;background:linear-gradient(transparent,#000b);font-size:16px;white-space:pre-wrap;word-break:break-word;pointer-events:none}
.sft{flex:none;z-index:3;padding:8px 10px calc(10px + env(safe-area-inset-bottom));background:#000}
.sft .rp{display:flex;gap:8px}.sft .rp input{flex:1;border-radius:24px}.sft .hb{width:48px;height:48px;font-size:26px;flex:none}
.vws{width:100%;padding:13px;border-radius:14px;background:rgba(255,255,255,.1);font-weight:700}
.vr{display:flex;justify-content:space-between;gap:10px;padding:13px 6px;border-bottom:1px solid var(--line)}.vr small{color:var(--mut)}
.tst{display:grid;place-items:center;padding:0;inset:auto;top:0;left:0;width:100%;height:100vh;height:100dvh;background:#c14bff}
.tst textarea{width:100%;max-width:520px;height:55%;background:none;border:0;text-align:center;font:600 30px/1.3 'DM Sans',sans-serif;resize:none;color:#fff;padding:20px}
.tst textarea::placeholder{color:#fff9}
.tst .pal{position:absolute;top:calc(10px + env(safe-area-inset-top));right:10px;width:42px;height:42px;border-radius:50%;background:#0006;font-size:20px}
.tst .send{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom))}
.bh{position:fixed;z-index:90;pointer-events:none;font-size:22px;animation:bh 1.4s ease-out forwards}
@keyframes bh{to{transform:translate(var(--dx),var(--dy)) scale(var(--s));opacity:0}}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);z-index:99;background:#000d;padding:10px 18px;border-radius:99px;font-size:14px}
@media (max-width:760px),(hover:none) and (pointer:coarse){
 .app{grid-template-columns:1fr}
 .sh .dlg{max-width:none;border-radius:24px 24px 0 0}
 .b{max-width:84%}
 .main{position:absolute;inset:0;transform:translateX(100%);transition:transform .22s}
 .app.chatting .main{transform:none}
 .back{display:grid}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <div class="bar"><button class="meb" id="meb"></button><b class="lg">Lynko<i>♥</i></b><button class="ic" id="menub">⋮</button></div>
    <div class="srch" id="srch"><input id="q" placeholder="Search chats" autocomplete="off"></div>
    <div class="chips" id="chips"><button class="on" data-f="all">All</button><button data-f="unread">Unread</button><button data-f="locked">Locked 🔒</button></div>
    <div class="list" id="list"></div>
    <button class="fab" id="fab" title="New chat">💬</button>
    <nav class="nav"><button class="on" id="n1"><i>💬</i>Chats</button><button id="n4"><i>✨</i>Status<em class="dot" id="sdot" hidden></em></button><button id="n2"><i>🖼</i>Wallpaper</button><button id="n3"><i>👤</i>You</button></nav>
  </aside>
  <section class="main">
    <div class="none" id="none"><div><i>♥</i><p style="margin-top:14px;line-height:1.6">Pick a chat, or start a new one.<br>Everything vanishes after 24 hours.</p></div></div>
    <div class="head" id="head" hidden>
      <button class="ic back" id="back">←</button>
      <button class="sm" id="hav"></button>
      <div class="t"><div id="hn"></div><small id="hs"></small></div>
      <button class="ic" id="hmenu">⋮</button>
    </div>
    <div class="msgs" id="msgs" hidden></div>
    <div class="attm" id="attm" hidden><button id="gal">🖼<span>Gallery</span></button><button id="cam">📷<span>Camera</span></button></div>
    <div class="comp" id="comp" hidden>
      <div class="pill"><button class="ib" id="att" type="button">📎</button><textarea id="txt" rows="1" placeholder="Message" enterkeyhint="send"></textarea></div>
      <button class="send" id="send" type="button">❤</button>
    </div>
  </section>
</div>
<input type="file" id="fs" accept="image/*,video/*" hidden><input type="file" id="fsc" accept="image/*" capture="environment" hidden><input type="file" id="fg" accept="image/*,video/*" hidden><input type="file" id="fc" accept="image/*" capture="environment" hidden>
<script>
const $=id=>document.getElementById(id), enc=new TextEncoder(), dec=new TextDecoder();
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const b64=b=>{let s='',u=new Uint8Array(b);for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const toast=t=>{const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)};
async function api(url,method='GET',body){
  const r=await fetch(url,{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});
  if(r.status==401){leave();throw new Error('auth')}
  const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Error');return d}
function leave(){localStorage.removeItem('lynko_priv');location.href='/'}

let me,priv,cur=null,contacts=new Map(),chats=new Map(),msgs=[],seen=new Set(),keys={},urls={},pl=new Map(),unlocked=new Set(),lastDay='',tc=0,typingT={},lastTy=0;
const hm=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const dayLbl=t=>{const d=new Date(t),n=new Date(),y=new Date(n-864e5);return d.toDateString()==n.toDateString()?'Today':d.toDateString()==y.toDateString()?'Yesterday':d.toLocaleDateString()};
const av=(c,cls='')=>`<div class="av ${cls}">${c.dpv?`<img src="/api/dp/${c.id}?v=${c.dpv}" alt="">`:(c.username||'?')[0].toUpperCase()}</div>`;
const lk=id=>`lk:${me.id}:${id}`;
const sha=async s=>hex(await crypto.subtle.digest('SHA-256',enc.encode(s)));

// ── crypto (ECDH → AES-GCM, keys cached per friend) ──
async function shared(id){
  if(keys[id])return keys[id];
  const pub=await crypto.subtle.importKey('jwk',JSON.parse((id==me.id?me:contacts.get(id)).pub),{name:'ECDH',namedCurve:'P-256'},false,[]);
  return keys[id]=await crypto.subtle.deriveKey({name:'ECDH',public:pub},priv,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function seal(id,data){const iv=crypto.getRandomValues(new Uint8Array(12));
  return {iv:b64(iv),ct:await crypto.subtle.encrypt({name:'AES-GCM',iv},await shared(id),data)}}
const open=async(id,iv,ct)=>crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(iv)},await shared(id),ct);
async function payload(m){
  if(pl.has(m.id))return pl.get(m.id);
  const peer=m.from==me.id?m.to:m.from;let p;
  try{p=JSON.parse(dec.decode(await open(peer,m.iv,unb64(m.ct))))}catch{p={k:'text',v:'🔒 Couldn’t decrypt this message'}}
  pl.set(m.id,p);return p}

async function upMedia(bytes){
  const r=await fetch('/api/media',{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:bytes});
  if(r.status==401){leave();throw new Error('auth')}
  const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Upload failed');return d.key}
async function deliver(kind,p,bytes,local,to){
  const peer=to||cur,show=peer==cur,m={id:'t'+(++tc),from:me.id,to:peer,kind,ts:new Date().toISOString(),media:kind!='text',rx:{},r:false,pending:true};
  const drop=()=>{const i=msgs.indexOf(m);if(i>-1)msgs.splice(i,1)};
  pl.set(m.id,p);if(local)urls[m.id]=local;seen.add(m.id);if(show){msgs.push(m);paint(m,p)}
  try{
    const s=await seal(peer,enc.encode(JSON.stringify(p))),body={to:peer,kind,iv:s.iv,ct:b64(s.ct)};
    if(bytes){const sb=await seal(peer,bytes);body.bIv=sb.iv;body.bkey=await upMedia(sb.ct)}   // encrypted file goes to the bucket, never to Mongo
    const real=await api('/api/messages','POST',body),el=$('m'+m.id);

    if(seen.has(real.id)){el?.remove();drop()}
    else{seen.add(real.id);Object.assign(m,real);m.pending=false;if(el){el.id='m'+real.id;tickEl(el)}}
    setLast(peer,real,0).then(renderList);
  }catch(e){$('m'+m.id)?.remove();drop();toast('Not sent: '+e.message)}
}

$('send').onclick=sendText;
$('txt').addEventListener('input',()=>{grow();if(Date.now()-lastTy>2800&&cur){lastTy=Date.now();fetch('/api/typing',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:cur})}).catch(()=>{})}});
$('txt').addEventListener('keydown',e=>{if(e.key=='Enter'&&!e.shiftKey&&!matchMedia('(pointer:coarse)').matches){e.preventDefault();sendText()}});

// ── photos & videos (WhatsApp-style preview, blurred thumb, caption) ──
const mini=(src,w,h)=>{const k=24/Math.max(w,h),c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));c.getContext('2d').drawImage(src,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.5)};
async function prepImg(f){
  const bm=await createImageBitmap(f),s=Math.min(1,1280/Math.max(bm.width,bm.height)),w=Math.round(bm.width*s),h=Math.round(bm.height*s);
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(bm,0,0,w,h);
  return {blob:await new Promise(r=>c.toBlob(r,'image/jpeg',.72)),w,h,th:mini(c,w,h)}}
const prepVid=f=>new Promise(res=>{
  const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';v.src=URL.createObjectURL(f);
  const fb=()=>res({blob:f,w:v.videoWidth||16,h:v.videoHeight||9,d:v.duration||0,th:''});setTimeout(fb,3000);
  v.onloadeddata=()=>{v.currentTime=Math.min(.1,(v.duration||1)/2)};
  v.onseeked=()=>res({blob:f,w:v.videoWidth,h:v.videoHeight,d:v.duration,th:mini(v,v.videoWidth,v.videoHeight)});v.onerror=fb});
const MAXV=16;   // MB
function pickMedia(f,mode='chat'){
  if(!f||(mode=='chat'&&!cur))return;const img=f.type.startsWith('image/'),vid=f.type.startsWith('video/');
  if(!img&&!vid)return toast('Only photos and videos');if(vid&&f.size>MAXV*1048576)return toast('Video must be under '+MAXV+' MB');
  const job=(img?prepImg(f):prepVid(f)).catch(()=>null),k=img?'img':'vid';   // starts compressing while you type the caption
  const o=document.createElement('div');o.className='ov pvw';
  o.innerHTML='<button class="x">✕</button><div class="st"></div><div class="cb"><input placeholder="Add a caption…" maxlength="300"><button class="send">➤</button></div>';
  const pu=URL.createObjectURL(f),el=document.createElement(img?'img':'video');el.src=pu;if(vid){el.controls=true;el.playsInline=true;el.muted=true}
  o.querySelector('.st').appendChild(el);document.body.appendChild(o);
  const close=()=>{o.remove();setTimeout(()=>URL.revokeObjectURL(pu),500)};
  o.querySelector('.x').onclick=close;
  o.querySelector('.send').onclick=async()=>{
    const cap=o.querySelector('input').value.trim();close();const r=await job;if(!r)return toast('Could not read this file');
    const p={k,mime:r.blob.type||f.type,w:r.w,h:r.h,d:r.d,th:r.th,cap,size:r.blob.size},bytes=await r.blob.arrayBuffer();
    if(mode=='status')return doPost(p,bytes);
    deliver(k,p,bytes,URL.createObjectURL(r.blob))}}
$('att').onclick=e=>{e.stopPropagation();$('attm').hidden=!$('attm').hidden};
document.addEventListener('click',()=>{$('attm').hidden=true});
$('gal').onclick=()=>$('fg').click();$('cam').onclick=()=>$('fc').click();
$('fg').onchange=$('fc').onchange=e=>{pickMedia(e.target.files[0]);e.target.value=''};

// ── status (WhatsApp-style · 24h · end-to-end encrypted) ──
// every status gets a random AES key; that key is wrapped separately for each contact (ECDH), the file goes to the bucket encrypted
let tab='chats',sts=[],stc=new Map(),sv=null,skipPop=0,posting=0;
const BG=['linear-gradient(135deg,#ff5c8a,#c14bff)','linear-gradient(135deg,#ffb38a,#ff5c8a)','linear-gradient(135deg,#4a1d7a,#0f0a2b)','linear-gradient(135deg,#0f766e,#164e63)','linear-gradient(135deg,#be123c,#4c0519)','linear-gradient(135deg,#1d4ed8,#7c3aed)'];
const bgOf=n=>BG[Math.max(0,Math.min(BG.length-1,parseInt(n)||0))];   // index only: a sender can never inject CSS
const safeTh=t=>typeof t=='string'&&/^data:image\/(jpeg|png|webp);base64,[\w+/=]+$/.test(t)?t:'';
const ago=t=>(new Date(t).toDateString()==new Date().toDateString()?'Today':'Yesterday')+', '+hm(t);

async function loadStatuses(){
  const d=await api('/api/statuses'),out=[];
  await Promise.all(d.map(async s=>{try{
    let c=stc.get(s.id);
    if(!c){const raw=await open(s.from,s.wk.iv,unb64(s.wk.ct)),k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt']);
      const p=JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(s.iv)},k,unb64(s.ct))));c={k,p};stc.set(s.id,c)}
    out.push({...s,k:c.k,p:c.p})}catch{}}));
  out.sort((a,b)=>a.ts.localeCompare(b.ts));sts=out;updDot();if(tab=='status')renderStatus()}
const updDot=()=>{$('sdot').hidden=!sts.some(s=>s.from!=me.id&&!s.seen)};
async function postStatus(p,bytes){
  const raw=crypto.getRandomValues(new Uint8Array(32)),k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt']),iv=crypto.getRandomValues(new Uint8Array(12));
  const body={iv:b64(iv),ct:b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,enc.encode(JSON.stringify(p)))),keys:{}};
  for(const id of [...contacts.keys(),me.id]){try{const w=await seal(id,raw);body.keys[id]={iv:w.iv,ct:b64(w.ct)}}catch{}}
  if(bytes){const bi=crypto.getRandomValues(new Uint8Array(12));body.bIv=b64(bi);body.bkey=await upMedia(await crypto.subtle.encrypt({name:'AES-GCM',iv:bi},k,bytes))}
  return api('/api/status','POST',body)}
async function doPost(p,bytes){
  if(posting)return toast('Still posting…');posting=1;toast('Posting status…');
  try{await postStatus(p,bytes);toast('Status posted ♥');await loadStatuses()}catch(e){toast('Not posted: '+e.message)}finally{posting=0}}
async function statusMedia(s){
  const id='s'+s.id;if(urls[id])return urls[id];
  const r=await fetch('/api/status/'+s.id+'/blob');if(!r.ok)throw 0;
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(s.bIv)},s.k,await r.arrayBuffer());
  const mime=/^(image|video)\/[\w.+-]+$/.test(s.p.mime||'')?s.p.mime:(s.p.k=='img'?'image/jpeg':'video/mp4');
  return urls[id]=URL.createObjectURL(new Blob([buf],{type:mime}))}

function srow(c,label,sub,ring,plus,fn){
  const b=document.createElement('button');b.className='item';
  b.innerHTML=`<div class="ring ${ring}">${av(c)}${plus?'<span class="plus">+</span>':''}</div><div class="n"><div class="r1"><b></b></div><div class="r2"><span class="pv"></span></div></div>`;
  b.querySelector('b').textContent=label;b.querySelector('.pv').textContent=sub;b.onclick=fn;
  if(plus)b.querySelector('.plus').onclick=e=>{e.stopPropagation();addStatus()};return b}
function renderStatus(){
  const l=$('list');l.innerHTML='';const g=new Map();sts.forEach(s=>{if(!g.has(s.from))g.set(s.from,[]);g.get(s.from).push(s)});
  const my=g.get(me.id)||[];
  l.appendChild(srow(me,'My status',my.length?my.length+' update'+(my.length>1?'s':'')+' · '+ago(my[my.length-1].ts):'Tap to add a status update',my.length?'mine':'none',1,()=>my.length?openViewer(me.id):addStatus()));
  const oth=[...g].filter(([id])=>id!=me.id&&contacts.has(id)).map(([id,a])=>({id,a,un:a.some(s=>!s.seen),t:a[a.length-1].ts})).sort((x,y)=>y.t.localeCompare(x.t));
  const sec=(t,arr)=>{if(!arr.length)return;const h=document.createElement('div');h.className='sec';h.textContent=t;l.appendChild(h);
    arr.forEach(x=>{const c=contacts.get(x.id);l.appendChild(srow(c,c.username,ago(x.t),x.un?'un':'',0,()=>openViewer(x.id)))})};
  sec('Recent updates',oth.filter(x=>x.un));sec('Viewed updates',oth.filter(x=>!x.un));
  if(!oth.length){const e=document.createElement('div');e.className='empty';e.innerHTML='No updates yet.<br>Statuses from your chats show up here and disappear after 24 hours.';l.appendChild(e)}}
function setTab(t){
  tab=t;$('n1').classList.toggle('on',t=='chats');$('n4').classList.toggle('on',t=='status');
  $('srch').hidden=$('chips').hidden=t=='status';$('fab').textContent=t=='status'?'📷':'💬';$('fab').title=t=='status'?'New status':'New chat';
  if(t=='status')loadStatuses().catch(()=>{});renderList()}
function addStatus(){items([['🖼 Photo / video',()=>$('fs').click()],['📷 Camera',()=>$('fsc').click()],['✏️ Text',textStatus]])}
$('fs').onchange=$('fsc').onchange=e=>{pickMedia(e.target.files[0],'status');e.target.value=''};
function textStatus(){
  let bi=0;const o=document.createElement('div');o.className='ov tst';
  o.innerHTML='<button class="x">✕</button><button class="pal">🎨</button><textarea maxlength="300" placeholder="Type a status"></textarea><button class="send">➤</button>';
  const t=o.querySelector('textarea'),paint=()=>o.style.background=BG[bi];paint();document.body.appendChild(o);t.focus();
  o.querySelector('.x').onclick=()=>o.remove();o.querySelector('.pal').onclick=()=>{bi=(bi+1)%BG.length;paint()};
  o.querySelector('.send').onclick=()=>{const v=t.value.trim();if(!v)return;o.remove();doPost({k:'text',v,bg:bi})}}

function openViewer(uid,start){
  const list=sts.filter(s=>s.from==uid);if(!list.length||sv)return;const own=uid==me.id,c=own?me:contacts.get(uid);
  let i=start!=null?start:Math.max(0,list.findIndex(s=>!s.seen)),ready=false,paused=false,hd=0,ty=0,acc=0,tk=0,el=null,last=performance.now();
  const o=document.createElement('div');o.className='sv';sv=o;
  o.innerHTML=`<div class="spg">${list.map(()=>'<i><b></b></i>').join('')}</div>
   <div class="shd"><div class="who">${av(c)}</div><div class="tm"><b></b><small></small></div><button class="tr" hidden>🗑</button><button class="cl">✕</button></div>
   <div class="scn"></div>
   <div class="sft">${own?'<button class="vws">👁 0</button>':'<div class="rp"><input maxlength="500" placeholder="Reply…" enterkeyhint="send"><button class="hb">❤️</button><button class="send">➤</button></div>'}</div>`;
  document.body.appendChild(o);history.pushState({sv:1},'');
  const scn=o.querySelector('.scn'),bars=[...o.querySelectorAll('.spg b')],inp=o.querySelector('input');
  o.querySelector('.tm b').textContent=own?'My status':c.username;
  const sync=()=>{paused=!!(hd||ty);if(el&&el.tagName=='VIDEO'){paused?el.pause():el.play().catch(()=>{})}};
  const close=(pop)=>{if(!sv)return;clearInterval(timer);el?.pause?.();o.remove();sv=null;if(!pop){skipPop=1;history.back()}updDot();if(tab=='status')renderStatus()};
  o._close=close;
  const go=d=>{const n=i+d;if(n>=list.length)return close();show(Math.max(0,n))};
  const timer=setInterval(()=>{const n=performance.now(),dt=n-last;last=n;if(paused||!ready||document.hidden)return;
    let f;if(el&&el.tagName=='VIDEO'&&el.duration)f=el.currentTime/el.duration;else{acc+=dt;f=acc/5000}
    bars[i].style.width=Math.min(100,f*100)+'%';if(f>=1)go(1)},60);
  async function show(n){
    i=n;const my=++tk,s=list[i];ready=false;acc=0;el=null;scn.innerHTML='';
    bars.forEach((b,j)=>b.style.width=j<i?'100%':'0');o.querySelector('.tm small').textContent=ago(s.ts);
    const cont=document.createElement('div');cont.className='cont';scn.appendChild(cont);
    if(own){o.querySelector('.tr').hidden=false;o.querySelector('.vws').textContent='👁 '+(s.views||[]).length}
    if(s.p.k=='text'){cont.className='cont txt';cont.style.background=bgOf(s.p.bg);cont.textContent=String(s.p.v||'');ready=true}
    else{
      cont.innerHTML='<i class="ssp"></i>';
      try{const u=await statusMedia(s);if(my!=tk)return;cont.innerHTML='';
        el=document.createElement(s.p.k=='img'?'img':'video');el.src=u;cont.appendChild(el);
        if(s.p.k=='vid'){el.playsInline=true;el.onended=()=>{if(my==tk)go(1)};el.play().catch(()=>{el.muted=true;el.play().catch(()=>{})})}
        if(s.p.cap){const cp=document.createElement('div');cp.className='scap';cp.textContent=String(s.p.cap);scn.appendChild(cp)}
        sync();ready=true}
      catch{if(my!=tk)return;cont.innerHTML='';cont.textContent='Couldn’t load this status';ready=true}}
    if(!own&&!s.seen){s.seen=true;api('/api/status/'+s.id+'/view','POST').catch(()=>{})}
    const nx=list[i+1];if(nx&&nx.p.k!='text'&&!urls['s'+nx.id])statusMedia(nx).catch(()=>{});   // preload next
  }
  let pd=0;
  scn.onpointerdown=()=>{pd=Date.now();hd=1;sync()};
  scn.onpointerup=e=>{hd=0;sync();if(Date.now()-pd<250)go(e.clientX/innerWidth<.3?-1:1)};
  scn.onpointercancel=scn.onpointerleave=()=>{hd=0;sync()};
  o.querySelector('.cl').onclick=()=>close();
  o.querySelector('.tr').onclick=async()=>{const s=list[i];ty=1;sync();
    const ok=await ask('Delete this status?',{ok:'Delete'});ty=0;sync();if(!ok)return;
    try{await api('/api/status/'+s.id,'DELETE');sts=sts.filter(x=>x.id!=s.id);list.splice(i,1);if(!list.length)return close();bars[bars.length-1].parentNode.remove();bars.pop();show(Math.min(i,list.length-1))}
    catch(e){toast(e.message)}};
  if(own)o.querySelector('.vws').onclick=()=>{
    const v=list[i].views||[];ty=1;sync();
    const sh=sheet(`<h3 style="margin-bottom:6px">Viewed by ${v.length}</h3>${v.length?'':'<p style="color:var(--mut);padding:10px 0">No views yet</p>'}<div class="vl"></div>`),rm=sh.remove.bind(sh);
    sh.remove=()=>{rm();ty=0;sync()};
    v.slice().sort((a,b)=>b.ts.localeCompare(a.ts)).forEach(x=>{const r=document.createElement('div');r.className='vr';r.innerHTML='<b></b><small></small>';
      r.firstChild.textContent=contacts.get(x.id)?.username||x.id;r.lastChild.textContent=ago(x.ts);sh.querySelector('.vl').appendChild(r)})};
  else{
    const reply=txt=>{txt=txt.trim();if(!txt)return false;const s=list[i];
      deliver('text',{k:'text',v:txt,re:{sid:s.id,k:s.p.k,t:String(s.p.k=='text'?s.p.v:s.p.cap||'').slice(0,80),th:s.p.k=='text'?'':safeTh(s.p.th)}},null,null,uid);
      toast('Reply sent ♥');return true};
    inp.onfocus=()=>{ty=1;sync()};inp.onblur=()=>{ty=0;sync()};
    const send=()=>{if(reply(inp.value)){inp.value='';inp.blur()}};
    o.querySelector('.send').onclick=send;inp.onkeydown=e=>{if(e.key=='Enter'){e.preventDefault();send()}};
    o.querySelector('.hb').onclick=e=>{reply('❤️');burst(e.clientX,e.clientY)}}
  show(Math.min(Math.max(i,0),list.length-1));
}

// ── menus ──
$('meb').onclick=profile;$('fab').onclick=()=>tab=='status'?addStatus():newChat();
$('q').oninput=e=>{qs=e.target.value.trim().toLowerCase();renderList()};
document.querySelectorAll('#chips button').forEach(b=>b.onclick=()=>{flt=b.dataset.f;document.querySelectorAll('#chips button').forEach(x=>x.classList.toggle('on',x==b));renderList()});
$('n1').onclick=()=>{if(tab!='chats')setTab('chats');else $('list').scrollTo({top:0,behavior:'smooth'})};$('n4').onclick=()=>setTab('status');$('n2').onclick=wallpaper;$('n3').onclick=profile;
$('menub').onclick=()=>items([['👤 Profile & About',profile],['🖼 Wallpaper',wallpaper],['💬 New chat',newChat],['⎋ Log out',async()=>{await fetch('/api/logout',{method:'POST'});leave()}]]);
$('hav').onclick=()=>{const c=contacts.get(cur);if(!c)return;const o=sheet(`<div class="pf">${av(c,'big')}<h3 style="margin:0"></h3><p style="color:var(--mut);text-align:center"></p><div class="idbox">ID<b>${c.id}</b></div></div>`);
  o.querySelector('h3').textContent=c.username;o.querySelector('p').textContent=c.about||'Hey there! I’m using Lynko'};
$('hmenu').onclick=()=>items([['🖼 Wallpaper',wallpaper],[localStorage.getItem(lk(cur))?'🔓 Remove chat lock':'🔒 Lock this chat',async()=>{
  const k=lk(cur);if(localStorage.getItem(k)){if(await ask('Remove lock from this chat?',{ok:'Remove'})){localStorage.removeItem(k);toast('Lock removed');renderList()}}
  else{const p=await ask('Set a 4–6 digit PIN',{pin:true,ok:'Lock'});if(p===null)return;if(!/^\d{4,6}$/.test(p))return toast('PIN must be 4–6 digits');
    localStorage.setItem(k,await sha(p+cur));unlocked.add(cur);toast('Chat locked');renderList()}}]]);
document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&cur&&localStorage.getItem(lk(cur))){unlocked.delete(cur);closeChat()}
  else if(!document.hidden&&cur){pull().catch(()=>{})}});

// ── start ──
(async()=>{
  const pj=localStorage.getItem('lynko_priv');if(!pj)return leave();
  let cfg;try{[me,cfg]=await Promise.all([api('/api/me'),api('/api/config')])}catch{return}
  priv=await crypto.subtle.importKey('jwk',JSON.parse(pj),{name:'ECDH',namedCurve:'P-256'},false,['deriveKey']);
  contacts=new Map(me.contacts.map(c=>[c.id,c]));paintMe();applyWp();renderList();loadChats().catch(()=>{});loadStatuses().catch(()=>{});
  const ps=new Pusher(cfg.key,{cluster:cfg.cluster,channelAuthorization:{endpoint:'/api/pusher/auth'}}),ch=ps.subscribe('private-u-'+me.id);
  ch.bind('msg',async d=>{
    const peer=d.from==me.id?d.to:d.from;
    if(!contacts.has(peer)){await loadContacts();keys={}}
    if(!d.ct){peer==cur?pull():loadChats();return}
    const live=peer==cur&&!document.hidden;
    await setLast(peer,d,undefined,true);
    if(live){await addMsg(d,true);if(d.from!=me.id)markRead()}
    else if(d.from!=me.id&&peer!=cur)navigator.vibrate?.(20);
    renderList()});
  ch.bind('del',d=>{const i=msgs.findIndex(m=>m.id==d.id);if(i>-1)msgs.splice(i,1);$('m'+d.id)?.remove();loadChats().catch(()=>{})});
  ch.bind('read',d=>{msgs.forEach(m=>{if(m.from==me.id&&m.to==d.by&&!m.r){m.r=true;tickEl($('m'+m.id))}});const c=chats.get(d.by);if(c&&c.m.from==me.id)c.m.r=true;renderList()});
  ch.bind('rx',d=>{setRx(d.id,d.rx);if(d.by!=me.id&&d.rx[d.by]=='❤️'){const r=$('m'+d.id)?.getBoundingClientRect();if(r)burst(r.left+r.width/2,r.top)}});
  ch.bind('typing',d=>{clearTimeout(typingT[d.from]);typingT[d.from]=setTimeout(()=>{delete typingT[d.from];setSub();renderList()},4000);if(d.from==cur)setSub();renderList()});
  for(const ev of ['status','sview','sdel'])ch.bind(ev,()=>loadStatuses().catch(()=>{}));
  ch.bind('prof',()=>loadContacts().then(()=>{if(cur)setSub()}).catch(()=>{}));
  let first=1;ps.connection.bind('connected',()=>{if(first){first=0;return}if(cur)pull();loadChats().catch(()=>{});loadStatuses().catch(()=>{})});
})();
